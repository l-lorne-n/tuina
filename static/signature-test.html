<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>电子签名安全测试页</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/signature-pad.css" />
    <link rel="stylesheet" href="/signature-test.css" />
  </head>
  <body class="signature-test-page">
    <main class="app-shell signature-pad-shell">
      <header class="topbar">
        <div>
          <h1>电子签名安全测试页</h1>
          <p id="padSummary">不读取真实患者，不绑定卡片，只保存到测试文件夹</p>
        </div>
        <nav class="page-links" aria-label="页面导航">
          <a class="button-link" href="/signature-pad.html">正式签名页</a>
          <a class="button-link" href="/">录入页</a>
          <a class="button-link" href="/patient-search.html">患者查找</a>
          <a class="button-link" href="/session-summary.html">流水总结</a>
        </nav>
      </header>

      <section class="signature-pad-layout">
        <aside class="signature-controls">
          <div class="test-warning">
            <strong>安全测试模式</strong>
            <span>保存后只进入 electronic_test 文件夹，不会出现在任何真实患者卡片里。</span>
          </div>

          <label>
            <span>测试对象</span>
            <input id="testNameInput" value="测试签名" />
          </label>

          <label>
            <span>签名类型</span>
            <select id="signatureKindSelect">
              <option value="visit">推拿签字 / 家长签字</option>
              <option value="case">病历签名 / 新患者签名</option>
              <option value="directory">目录签名</option>
            </select>
          </label>

          <label>
            <span>签字人</span>
            <input id="signerNameInput" placeholder="可不填" />
          </label>

          <label>
            <span>备注</span>
            <input id="signatureNoteInput" placeholder="可不填" />
          </label>

          <div class="signature-actions">
            <button id="clearButton" type="button">清空</button>
            <button id="undoButton" type="button">撤销一笔</button>
            <button id="saveSignatureButton" class="primary" type="button">保存测试签名</button>
            <button id="fullScreenButton" type="button">全屏签名</button>
          </div>

          <div class="signature-device-state">
            <div>
              <span>输入</span>
              <strong id="pointerTypeText">未开始</strong>
            </div>
            <div>
              <span>压感</span>
              <strong id="pressureText">-</strong>
            </div>
          </div>

          <div id="saveStatus" class="save-status">等待测试签名</div>
        </aside>

        <section class="signature-workspace">
          <div class="signature-canvas-head">
            <div>
              <h2 id="activePatientName">测试签名</h2>
              <p id="activePatientMeta">这页不会修改真实患者数据库</p>
            </div>
            <a class="text-link" href="/signature-pad.html">进入正式签名页</a>
          </div>

          <div class="canvas-frame">
            <canvas id="signatureCanvas" aria-label="电子签名测试画布"></canvas>
          </div>

          <section class="latest-save">
            <div class="section-head">
              <h2>刚保存的测试签名</h2>
            </div>
            <div class="latest-save-body">
              <div class="latest-save-image">
                <img id="latestSignatureImage" alt="" hidden />
                <span id="latestSignatureEmpty">还没有保存测试签名</span>
              </div>
              <div>
                <div id="latestSignatureInfo" class="latest-signature-info">-</div>
                <a id="latestSignatureLink" class="text-link" href="#" target="_blank" rel="noreferrer" hidden>打开图片</a>
              </div>
            </div>
          </section>

          <section class="latest-save">
            <div class="section-head">
              <h2>最近测试记录</h2>
              <button id="refreshTestsButton" type="button">刷新</button>
            </div>
            <div id="testSignatureGrid" class="test-signature-grid"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="/signature-test.js"></script>
  </body>
</html>
