<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>月结单</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/session-summary.css" />
    <link rel="stylesheet" href="/settlement-detail.css" />
  </head>
  <body data-tool-page="settlements">
    <main class="app-shell summary-shell">
      <header class="topbar">
        <div>
          <h1 id="settlementTitle">月结单</h1>
          <p id="settlementStatus">正在读取月结快照</p>
        </div>
        <nav class="page-links" aria-label="页面导航">
          <a class="button-link" href="/settlements.html">返回月结</a>
          <a class="button-link" href="/patient-search.html">患者查找</a>
        </nav>
      </header>

      <div id="revokedBanner" class="settlement-banner revoked" hidden></div>

      <section class="stat-grid" aria-label="汇总数据">
        <div class="stat-card">
          <div class="stat-label">充值金额</div>
          <div id="rechargeAmountValue" class="stat-value">-</div>
          <div id="rechargeDetailValue" class="stat-note">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">充值次数</div>
          <div id="rechargeSessionsValue" class="stat-value">-</div>
          <div id="rechargeCountValue" class="stat-note">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">有效推拿次数</div>
          <div id="massageSessionsValue" class="stat-value">-</div>
          <div id="massageCountValue" class="stat-note">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">涉及患者</div>
          <div id="patientCountValue" class="stat-value">-</div>
          <div id="recordCountValue" class="stat-note">-</div>
        </div>
      </section>

      <section class="summary-card">
        <div class="section-head"><h2>师傅有效推拿次数</h2></div>
        <div id="therapistStatsTable" class="summary-table"></div>
      </section>

      <section class="summary-card">
        <div class="section-head"><h2 id="debtTitle">结算截止日赊账患者</h2></div>
        <div id="debtTable" class="summary-table"></div>
      </section>

      <section class="summary-card">
        <div class="section-head"><h2>月结流水明细</h2></div>
        <div id="recordTable" class="summary-table"></div>
      </section>

      <section id="revokeCard" class="summary-card settlement-revoke-card" hidden>
        <div class="section-head"><h2>撤销这份月结单</h2></div>
        <p class="settlement-warning">只能撤销最后一份有效月结。撤销后，上一份月结会自动获得撤销能力。</p>
        <div class="settlement-revoke-grid">
          <label>
            <span>撤销原因</span>
            <select id="revokeReasonSelect">
              <option value="日期选错">日期选错</option>
              <option value="流水需要修改">流水需要修改</option>
              <option value="其他">其他</option>
            </select>
          </label>
          <label>
            <span>补充说明</span>
            <input id="revokeReasonNote" type="text" placeholder="选择其他时必须填写" />
          </label>
          <button id="revokeButton" class="danger-button" type="button">撤销月结单</button>
        </div>
      </section>
    </main>

    <script src="/settlement-detail.js"></script>
    <script src="/tools-nav.js"></script>
  </body>
</html>
